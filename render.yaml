services:
  - type: web
    name: neverskip-back
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/NeverSkip-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false