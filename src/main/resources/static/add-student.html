<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link rel="stylesheet" href="css/add-student.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h2>Add Student</h2>

        <form id="studentForm">

            <label>Student ID</label>
            <input type="number" id="stdId" placeholder="Enter Student ID">

            <label>Student Name</label>
            <input type="text" id="stdName" placeholder="Enter Student Name">

            <label>Class</label>
            <input type="text" id="className" placeholder="Enter Class">

            <label>Section</label>
            <input type="text" id="section" placeholder="Enter Section">

            <label>Score</label>
            <input type="number" id="score" placeholder="Enter Score">

            <button type="button" onclick="saveStudent()">
                Save Student
            </button>

            <button type="button" onclick="window.location.href='dashboard.html'">
                Back
            </button>

        </form>

    </div>

    <script src="js/add-student.js"></script>

</body>

</html>
