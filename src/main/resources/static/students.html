<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Students | NeverSkip</title>

    <link rel="stylesheet" href="css/students.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-circle">
                NS
            </div>

            <h2>NeverSkip</h2>

        </div>

        <ul>

            <li onclick="location.href='dashboard.html'">
                <i class="bi bi-grid-fill"></i>
                Dashboard
            </li>

            <li class="active">
                <i class="bi bi-people-fill"></i>
                Students
            </li>

            <li onclick="location.href='add-student.html'">
                <i class="bi bi-person-plus-fill"></i>
                Add Student
            </li>

            <li onclick="location.href='upload-csv.html'">
                <i class="bi bi-upload"></i>
                Upload CSV
            </li>

            <li onclick="location.href='search.html'">
                <i class="bi bi-search"></i>
                Search
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main>

        <header>

            <h1>Student Management</h1>

            <button onclick="location.href='dashboard.html'">

                <i class="bi bi-arrow-left"></i>

                Back

            </button>

        </header>

        <!-- Search -->

        <section class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by Student Name...">

            <button onclick="searchStudent()">

                <i class="bi bi-search"></i>

                Search

            </button>

        </section>

        <!-- Student Table -->

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Class</th>

                    <th>Section</th>

                    <th>Score</th>

                    <th>Action</th>

                </tr>

                </thead>

                <tbody id="studentTable">

                <!-- JavaScript will insert rows here -->

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="js/students.js"></script>

</body>

</html>
